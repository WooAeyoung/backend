name: Spring backend CI

on:
  pull_request:
    paths:
      - "spring-backend/**"
      - ".github/workflows/spring-backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "spring-backend/**"
      - ".github/workflows/spring-backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: ./mvnw --batch-mode test
