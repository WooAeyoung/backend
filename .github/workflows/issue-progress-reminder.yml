name: Issue progress reminder bot

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Check progress and notify assignees
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            const scope = {
              Frontend: {
                1: '배포 API 연결·영양 기준 선택·오류 재시도와 실제 배포 검증',
                2: '18개 영양소 입력·결과·근거 UI와 단위·출처·모바일 검증',
                3: '정적 엔진·추천 결과 일치와 실패 안내·프로덕션 빌드 검증'
              },
              backend: {
                1: '기준 버전·영양소 마스터와 API 계약',
                2: '생애주기·성장곡선·열량 계산',
                3: '단위 환산과 실제·추정 근거',
                4: '체중별 용량과 추천 점수식',
                5: 'NIAS API 계약과 T1~T16 검산'
              }
            };
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100
              });
              const marker = `<!-- progress-reminder:${issue.number}:`;
              const markers = comments
                .filter(comment => (comment.body || '').includes(marker))
                .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
              const previous = markers.at(-1);
              const since = previous?.created_at || issue.created_at;
              const after = value => new Date(value) > new Date(since);
              const humanUpdate = comments.some(comment =>
                after(comment.created_at) && comment.user.type !== 'Bot'
              );
              const linkedPr = pulls.some(pr => {
                const text = `${pr.title}\n${pr.body || ''}`;
                return after(pr.updated_at) && text.includes(`#${issue.number}`);
              });
              const commits = await github.paginate(github.rest.repos.listCommits, {
                owner, repo, since, per_page: 100
              });
              const linkedCommit = commits.some(commit =>
                (commit.commit.message || '').includes(`#${issue.number}`)
              );
              if (humanUpdate || linkedPr || linkedCommit) continue;

              const assignees = (issue.assignees || []).map(user => `@${user.login}`).join(' ');
              const requested = scope[repo]?.[issue.number] || '이슈 본문에 정의된 작업 범위';
              const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `${marker}${today} -->\n${assignees}\n\n마지막 봇 점검 뒤 커밋·연결 PR·담당자 업데이트 증거가 없습니다.\n\n- 작업 범위: ${requested}\n- 제출 기준: 최신 main 기반 PR, 검증 결과, 남은 차단 요인\n\n의료 기준·제품 데이터는 검증된 출처가 확인될 때까지 데모 범위와 한계를 PR에 명시해 주세요.`
              });
            }
