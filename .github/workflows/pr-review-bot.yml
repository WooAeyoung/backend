name: PR review bot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Review changed files
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- wooaeyoung-pr-review-bot -->';
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const names = files.map(file => file.filename);
            const javaChanged = names.some(name => name.startsWith('spring-backend/src/main/java/'));
            const testsChanged = names.some(name => name.startsWith('spring-backend/src/test/'));
            const standardsChanged = names.some(name => name.includes('/standards/') && name.endsWith('.json'));
            const standardsDocsChanged = names.some(name => name === 'docs/standards-validation.md');
            const additions = files.reduce((sum, file) => sum + file.additions, 0);
            const deletions = files.reduce((sum, file) => sum + file.deletions, 0);
            const added = files.map(file => file.patch || '').join('\n').split('\n').filter(line => line.startsWith('+') && !line.startsWith('+++')).join('\n');
            const findings = [];
            if (javaChanged && !testsChanged) findings.push('⚠️ Java 운영 코드가 변경됐지만 `spring-backend/src/test` 변경이 없습니다. 회귀 테스트가 필요한지 확인하세요.');
            if (standardsChanged && !standardsDocsChanged) findings.push('⚠️ 영양 기준 JSON이 변경됐지만 검증 문서가 갱신되지 않았습니다. 출처·검증 상태를 확인하세요.');
            if (additions + deletions > 1000) findings.push('⚠️ 변경량이 1,000줄을 넘습니다. 기능별 PR 분리가 가능한지 확인하세요.');
            if (/System\.out\.(print|println)/.test(added)) findings.push('⚠️ 추가된 코드에 `System.out` 출력이 있습니다. 운영 로깅으로 교체할지 확인하세요.');
            if (/localhost|127\.0\.0\.1/.test(added)) findings.push('⚠️ 추가된 코드에 로컬 주소가 있습니다. 배포 환경 설정으로 분리됐는지 확인하세요.');
            if (/(api[_-]?key|secret|token|password)\s*[:=]\s*["'][^"']{8,}/i.test(added)) findings.push('🚨 추가된 코드에서 민감정보로 보이는 문자열을 발견했습니다. 실제 비밀값이면 즉시 제거하고 키를 폐기하세요.');
            const body = [
              marker,
              '## 🤖 백엔드 PR 자동 검토',
              '',
              `- 변경 파일: **${files.length}개** (+${additions} / -${deletions})`,
              `- Java 운영 코드: ${javaChanged ? '변경됨' : '변경 없음'}`,
              `- 테스트 코드: ${testsChanged ? '변경됨' : '변경 없음'}`,
              `- 영양 기준 데이터: ${standardsChanged ? '변경됨' : '변경 없음'}`,
              '',
              findings.length ? '### 확인 필요\n' + findings.map(item => `- ${item}`).join('\n') : '✅ 정적 검토에서 즉시 확인할 항목을 찾지 못했습니다.',
              '',
              '> Maven 실행 결과는 `Spring backend CI` 체크에서 별도로 확인합니다. 이 봇 결과는 사람의 도메인·데이터 검토를 대체하지 않습니다.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }
