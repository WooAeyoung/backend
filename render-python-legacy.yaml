services:
  - type: web
    name: wooaeyoung-backend-python
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: CORS_ORIGINS
        value: https://wooaeyoung.github.io,http://localhost:5173
      - key: GITHUB_TOKEN
        sync: false
      - key: KAKAO_ALLOWED_USER_IDS
        sync: false
