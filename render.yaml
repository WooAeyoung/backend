services:
  - type: web
    name: wooaeyoung-backend
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: CORS_ORIGINS
        value: https://wooaeyoung.github.io
