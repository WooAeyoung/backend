services:
  - type: web
    name: wooaeyoung-backend
    runtime: docker
    plan: free
    rootDir: spring-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CORS_ORIGINS
        value: https://wooaeyoung.github.io,https://wooaeyoung-pet-nutrition.vercel.app,http://localhost:5173
      - key: PUBLIC_BASE_URL
        value: https://wooaeyoung-backend.onrender.com
      - key: WOOAEYOUNG_STANDARDS_ALLOW_UNVERIFIED
        value: "true"
      - key: KAKAO_OAUTH_BASE_URL
        value: https://wooaeyoung-backend-python.onrender.com
      - key: GITHUB_TOKEN
        sync: false
      - key: KAKAO_ALLOWED_USER_IDS
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_SKILL_SECRET
        sync: false
      - key: JARVIS_PROVIDER
        value: openjarvis
      - key: JARVIS_FALLBACK_PROVIDER
        value: gemini
      - key: JARVIS_TERTIARY_PROVIDER
        value: freellmapi
      - key: OPENJARVIS_BASE_URL
        sync: false
      - key: OPENJARVIS_API_KEY
        sync: false
      - key: OPENJARVIS_MODEL
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: XAI_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-4.7
      - key: OLLAMA_BASE_URL
        value: http://127.0.0.1:11434
      - key: OLLAMA_MODEL
        value: llama3.2
      - key: OLLAMA_API_KEY
        sync: false
      - key: AIMLAPI_API_KEY
        sync: false
      - key: AIMLAPI_MODEL
        value: openai/gpt-5-5
      - key: FREELLMAPI_BASE_URL
        sync: false
      - key: FREELLMAPI_API_KEY
        sync: false
      - key: FREELLMAPI_MODEL
        value: dots3-note-preview
