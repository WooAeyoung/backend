services:
  app:
    build: .
    restart: unless-stopped
    environment:
      WOOAEYOUNG_PUBLIC_SERVER: "1"
      WOOAEYOUNG_DB: /app/storage/wooaeyoung.db
      WOOAEYOUNG_CORS_ORIGINS: ${WOOAEYOUNG_CORS_ORIGINS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
    # Connect an HTTPS reverse proxy on this host to this loopback port.
    ports:
      - "127.0.0.1:8756:8756"
    volumes:
      - wooaeyoung-data:/app/storage
    init: true

volumes:
  wooaeyoung-data:
